name: Deploy HAIPAC production to Firebase

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: haipac-firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            email-functions/package-lock.json
      - name: Install frontend build dependencies
        run: npm ci
      - name: Install Functions dependencies
        run: npm ci --prefix functions
      - name: Install email Functions dependencies
        run: npm ci --prefix email-functions
      - name: Verify selected custom domain before production build
        shell: bash
        env:
          HAIPAC_PUBLIC_URL: ${{ vars.HAIPAC_PUBLIC_URL }}
        run: |
          set -euo pipefail
          public_url="${HAIPAC_PUBLIC_URL:-https://haipac-7e19d.web.app}"
          if [[ "$public_url" != "https://www.haipaclogistics.com" ]]; then
            echo "Using the Firebase beta URL; custom-domain preflight is not required."
            exit 0
          fi
          page="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 "$public_url/")"
          if ! grep -Fq '<title>HAIPAC Logistics — le parcours de vos colis</title>' <<< "$page"; then
            echo "The selected custom domain is not serving the HAIPAC Hosting site yet." >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 6 --retry-delay 5 "$public_url/api/v1/communes" --output /dev/null
          echo "The selected custom domain serves the HAIPAC site and API over HTTPS."
      - name: Build production frontend
        run: npm run build
        env:
          HAIPAC_MODE: production
          HAIPAC_API_BASE_URL: /api/
          HAIPAC_PUBLIC_URL: ${{ vars.HAIPAC_PUBLIC_URL }}
          HAIPAC_INDEXING_ENABLED: ${{ vars.HAIPAC_INDEXING_ENABLED }}
          LEGAL_CONTENT_APPROVED: ${{ vars.LEGAL_CONTENT_APPROVED }}
          OPERATIONS_READY: ${{ vars.OPERATIONS_READY }}
      - name: Compile Cloud Functions
        run: npm --prefix functions run build
      - name: Run logistics and role checks
        run: npm --prefix functions test
      - id: auth
        name: Authenticate to the HAIPAC Google Cloud project with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: haipac-7e19d
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud SDK for secret metadata checks
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: haipac-7e19d
          version: '>= 363.0.0'
      - name: Verify required Firebase secret names and enabled versions
        shell: bash
        run: |
          set -euo pipefail
          required_secrets=(
            SMARTCUT_HMAC_SECRET
            CLAIM_TOKEN_ENCRYPTION_KEY
            DELIVERY_CODE_SECRET
            TRACKING_RATE_LIMIT_SECRET
            RESEND_API_KEY
            CRON_SECRET
          )
          failed=0
          for secret in "${required_secrets[@]}"; do
            if ! gcloud secrets describe "$secret" --project=haipac-7e19d --format='value(name)' >/dev/null; then
              echo "Cannot verify required Secret Manager metadata for: $secret" >&2
              failed=1
              continue
            fi
            if ! versions="$(gcloud secrets versions list "$secret" --project=haipac-7e19d --filter='state=ENABLED' --format='value(name)')"; then
              echo "Cannot verify enabled Secret Manager versions for: $secret" >&2
              failed=1
              continue
            fi
            if [[ -z "$versions" ]]; then
              echo "Required secret has no enabled version: $secret" >&2
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "Firebase deployment stopped before Hosting provisioning." >&2
            exit 1
          fi
          echo "All six required Secret Manager resources have an enabled version."
      - name: Verify Cloud Functions artifact cleanup configuration
        shell: bash
        run: |
          set -euo pipefail
          repository="$(gcloud artifacts repositories describe gcf-artifacts \
            --project=haipac-7e19d --location=us-east4 --format=json)"
          if ! printf '%s' "$repository" | jq -e '
            .labels["firebase-functions-cleanup-opted-out"] == "true"
            or ((.cleanupPolicies // {}) | length > 0)
          ' >/dev/null; then
            echo "No Cloud Functions artifact cleanup policy or explicit opt-out exists in us-east4." >&2
            echo "Have the HAIPAC project owner configure it before deployment; GitHub is intentionally not granted repository-policy write permissions." >&2
            exit 1
          fi
          echo "Artifact cleanup configuration is present."
      - name: Configure production Functions parameters
        shell: bash
        env:
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          HAIPAC_PUBLIC_URL: ${{ vars.HAIPAC_PUBLIC_URL }}
          HAIPAC_INDEXING_ENABLED: ${{ vars.HAIPAC_INDEXING_ENABLED }}
          LEGAL_CONTENT_APPROVED: ${{ vars.LEGAL_CONTENT_APPROVED }}
          OPERATIONS_READY: ${{ vars.OPERATIONS_READY }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const sender = (process.env.EMAIL_FROM ?? "").trim();
          function approvalValue(name) {
            const value = (process.env[name] ?? "").trim().toLowerCase() || "false";
            if (value !== "true" && value !== "false") {
              console.error(`Set ${name} to exactly true or false; the default is false.`);
              process.exit(1);
            }
            return value;
          }
          const legalContentApproved = approvalValue("LEGAL_CONTENT_APPROVED");
          const operationsReady = approvalValue("OPERATIONS_READY");
          const indexingEnabled = approvalValue("HAIPAC_INDEXING_ENABLED");
          const publicUrl = (process.env.HAIPAC_PUBLIC_URL ?? "").trim() || "https://haipac-7e19d.web.app";
          const allowedPublicUrls = new Set([
            "https://haipac-7e19d.web.app",
            "https://www.haipaclogistics.com",
          ]);
          if (!allowedPublicUrls.has(publicUrl)) {
            console.error("Set HAIPAC_PUBLIC_URL to the HAIPAC beta or verified www domain URL.");
            process.exit(1);
          }
          if (indexingEnabled === "true" && (
            legalContentApproved !== "true"
            || operationsReady !== "true"
            || publicUrl !== "https://www.haipaclogistics.com"
          )) {
            console.error("Search indexing requires approved legal content and operations, plus the verified www domain.");
            process.exit(1);
          }
          const match = /^[A-Za-z0-9.!#$%&'*+/=?^_`{|}~-]+@([A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?)+)$/.exec(sender);
          const domain = match?.[1]?.toLowerCase();
          if (!match || (domain !== "haipaclogistics.com" && !domain.endsWith(".haipaclogistics.com"))) {
            console.error("Set the production environment variable EMAIL_FROM to a bare sender address on the verified haipaclogistics.com domain.");
            process.exit(1);
          }
          const parameters = [
            "HAIPAC_FUNCTION_REGION=us-east4",
            "HAIPAC_RUNTIME_SERVICE_ACCOUNT=haipac-functions-runtime@haipac-7e19d.iam.gserviceaccount.com",
            `HAIPAC_PUBLIC_URL=${publicUrl}`,
            `EMAIL_FROM=${sender}`,
            "EMAIL_PROVIDER_CONFIGURED=true",
            `LEGAL_CONTENT_APPROVED=${legalContentApproved}`,
            `OPERATIONS_READY=${operationsReady}`,
            "",
          ].join("\n");
          fs.writeFileSync("functions/.env.haipac-7e19d", parameters, { mode: 0o600 });
          fs.writeFileSync(
            "email-functions/.env.haipac-7e19d",
            [
              "HAIPAC_FUNCTION_REGION=us-east4",
              "HAIPAC_RUNTIME_SERVICE_ACCOUNT=haipac-functions-runtime@haipac-7e19d.iam.gserviceaccount.com",
              `EMAIL_FROM=${sender}`,
              "EMAIL_PROVIDER_CONFIGURED=true",
              `LEGAL_CONTENT_APPROVED=${legalContentApproved}`,
              `OPERATIONS_READY=${operationsReady}`,
              "",
            ].join("\n"),
            { mode: 0o600 },
          );
          console.log(`Production Functions parameters configured; legal approval=${legalContentApproved}, operations readiness=${operationsReady}, indexing=${indexingEnabled}.`);
          NODE
      - name: Provision the default Firebase Hosting site if needed
        run: |
          sites_json="$(npm exec -- firebase hosting:sites:list --project haipac-7e19d --json)"
          if ! printf '%s\n' "$sites_json" | grep -Fq 'projects/haipac-7e19d/sites/haipac-7e19d'; then
            npm exec -- firebase hosting:sites:create haipac-7e19d --project haipac-7e19d --non-interactive
          fi
      - name: Deploy the HAIPAC frontend, API and email codebases
        run: npm exec -- firebase deploy --project haipac-7e19d --only hosting,functions:haipac-api,functions:haipac-email --non-interactive
      - name: Verify public frontend and API
        env:
          HAIPAC_PUBLIC_URL: ${{ vars.HAIPAC_PUBLIC_URL }}
        run: |
          set -euo pipefail
          public_url="${HAIPAC_PUBLIC_URL:-https://haipac-7e19d.web.app}"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 "$public_url/" --output /dev/null
          curl --fail --silent --show-error --retry 8 --retry-delay 5 "$public_url/api/v1/communes" --output /dev/null
      - name: Verify deployed Functions and email scheduler
        shell: bash
        run: |
          set -euo pipefail
          functions="$(gcloud functions list --v2 --regions=us-east4 --project=haipac-7e19d --format=json)"
          api_state="$(printf '%s' "$functions" | jq -r '[.[] | select((.name | split("/")[-1]) == "api") | .state][0] // "MISSING"')"
          email_state="$(printf '%s' "$functions" | jq -r '[.[] | select((.name | split("/")[-1]) == "processHaipacEmailOutbox") | .state][0] // "MISSING"')"
          if [[ "$api_state" != "ACTIVE" || "$email_state" != "ACTIVE" ]]; then
            echo "Expected HAIPAC functions to be ACTIVE after deployment (api=$api_state, email=$email_state)." >&2
            exit 1
          fi

          jobs="$(gcloud scheduler jobs list --location=us-east4 --project=haipac-7e19d --format=json)"
          job="$(printf '%s' "$jobs" | jq -c '[.[] | select((.name | split("/")[-1]) == "firebase-schedule-processHaipacEmailOutbox-us-east4")][0] // empty')"
          if [[ -z "$job" ]]; then
            echo 'The HAIPAC email scheduler job was not created.' >&2
            exit 1
          fi
          state="$(printf '%s' "$job" | jq -r '.state // "UNKNOWN"')"
          schedule="$(printf '%s' "$job" | jq -r '.schedule // "UNKNOWN"')"
          timezone="$(printf '%s' "$job" | jq -r '.timeZone // "UNKNOWN"')"
          if [[ "$state" != "ENABLED" || "$timezone" != "America/Port-au-Prince" || ( "$schedule" != "* * * * *" && "$schedule" != "every 1 minutes" ) ]]; then
            echo "The HAIPAC email scheduler has an unexpected configuration (state=$state, schedule=$schedule, timezone=$timezone)." >&2
            exit 1
          fi
          echo 'Both HAIPAC functions are ACTIVE and the email scheduler is enabled every minute in America/Port-au-Prince.'
