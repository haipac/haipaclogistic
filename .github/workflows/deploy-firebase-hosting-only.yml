name: Deploy HAIPAC frontend only

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: haipac-firebase-production
  cancel-in-progress: false

jobs:
  deploy-hosting:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend build dependencies
        run: npm ci
      - name: Build beta frontend without opening operational gates
        run: npm run build
        env:
          HAIPAC_MODE: production
          HAIPAC_API_BASE_URL: /api/
          HAIPAC_PUBLIC_URL: https://haipac-7e19d.web.app
          LEGAL_CONTENT_APPROVED: 'false'
          OPERATIONS_READY: 'false'
          HAIPAC_INDEXING_ENABLED: 'false'
      - name: Authenticate to the HAIPAC Firebase project with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: haipac-7e19d
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Deploy only Firebase Hosting
        run: npm exec -- firebase deploy --project haipac-7e19d --only hosting --non-interactive
      - name: Verify the deployed homepage and hero assets
        shell: bash
        run: |
          set -euo pipefail
          for domain in https://haipac-7e19d.web.app https://www.haipaclogistics.com; do
            page="$RUNNER_TEMP/$(printf '%s' "$domain" | sed 's#https://##; s#[^A-Za-z0-9]#-#g').html"
            curl --fail --silent --show-error --retry 8 --retry-delay 5 "$domain/" --output "$page"
            grep -Fq 'assets/css/atl-design-system.css?v=haipac-atl-20261120-10' "$page"
            grep -Fq 'assets/css/public-pages.css?v=haipac-public-20261120-13' "$page"
            grep -Fq 'assets/js/site-ui.js?v=haipac-atl-20261120-10' "$page"
          done
